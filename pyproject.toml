[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "style-fingerprint"
version = "0.1.0"
description = "Local personal writing style compatibility and explanations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "pandas>=2.2,<4", "pyarrow>=17,<26", "joblib>=1.4,<2", "PyYAML>=6,<7", "torch>=2.6,<3", "transformers>=4.57.6,<5", "huggingface-hub>=0.30,<1", "einops>=0.8,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
supervised = ["lightgbm>=4,<5"]

[project.scripts]
style-fingerprint = "style_fingerprint.cli:main"

[tool.setuptools.packages.find]
include = ["style_fingerprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: real pretrained inference; explicitly opt in"]

[tool.setuptools.package-data]
style_fingerprint = ["web/index.html"]
